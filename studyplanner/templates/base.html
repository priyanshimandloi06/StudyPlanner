<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">📚 Study Planner</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'dashboard' %}">Today</a>
      <a class="nav-link" href="{% url 'plan' %}">Timetable</a>
      <a class="nav-link" href="{% url 'report' %}">Weekly Report</a>
    </div>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button class="btn btn-sm btn-outline-light">Logout ({{ user.username }})</button>
    </form>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}info{% endif %}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
